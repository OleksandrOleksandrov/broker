[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "alex-database",
    "boto3>=1.40.29",
    "langfuse>=3.3.4",
    "openai-agents>=0.3.0",
    "pydantic-ai>=1.0.6",
    "python-dotenv>=1.1.1",
    "openai>=1.14.0",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.3"
]

[tool.uv.workspace]
members = [
    "database",
    "api",
    "scheduler",
]

[tool.uv.sources]
alex-database = { workspace = true }
